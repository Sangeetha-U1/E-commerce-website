<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Jost', sans-serif;
      background: linear-gradient(135deg, #f5f5f5, #eaeaea);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 350px;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    .login-box h2 {
      margin-bottom: 20px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .login-box input {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      transition: 0.3s;
    }

    .login-box input:focus {
      border-color: #000;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-box button:hover {
      background: #333;
    }

    .login-box p {
      margin-top: 15px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="login-box">
  <h2>Login</h2>

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p>Enter your credentials to continue</p>
</div>

<script src="js/script.js"></script>

</body>
</html>
