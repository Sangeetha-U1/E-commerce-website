<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#f5f5f5;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .login-box{
      width:350px;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<div class="login-box">
  <h3 class="text-center mb-4">Login</h3>

  <input type="email" id="email" class="form-control mb-3" placeholder="Enter Email">

  <input type="password" id="password" class="form-control mb-3" placeholder="Enter Password">

  <button class="btn btn-dark w-100" onclick="loginUser()">
    Login / Signup
  </button>
</div>

<script>
  function loginUser(){

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if(email === "" || password === ""){
      alert("Please fill all fields");
      return;
    }

    // Save login status
    localStorage.setItem("isLoggedIn", "true");

    // Redirect to website
    window.location.href = "index.html";
  }
</script>

</body>
</html>
